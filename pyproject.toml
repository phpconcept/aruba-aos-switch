[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aruba-aos-switch"
version = "0.1.0"
description = "Client Python pour l'API REST des switchs HPE Aruba Networking sous ArubaOS-Switch (AOS-S)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vincent Blavet", email = "vincent@phpconcept.net" },
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/phpconcept/aruba-aos-switch"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aruba_aos_switch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant un switch ArubaOS-Switch réel joignable (voir tests/test_integration.py)",
]
